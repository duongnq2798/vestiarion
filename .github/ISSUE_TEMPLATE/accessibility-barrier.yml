name: Accessibility barrier
description: Something stops you, or makes a task hard, with a keyboard, a screen reader, zoom or another way you work.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. [ACCESSIBILITY.md](https://github.com/duongnq2798/vestiarion/blob/main/ACCESSIBILITY.md) says what we aim for and what we already know is missing.

        Issues are public. Leave out personal data, and never paste an API key, a sign-in or payee link, or a wallet key. If you would rather not use GitHub, send a direct message to [@vestiarionhq](https://x.com/vestiarionhq) on X instead.
  - type: input
    id: page
    attributes:
      label: Page or screen
      description: Its address, or its name, such as Approvals or the Go live guide.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What you were trying to do
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What happened, what you heard or saw, and where it stopped you.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What you use
      description: Optional. For example a screen reader and its version, a keyboard alone, voice control, magnification or a zoom level, and your browser and operating system.
  - type: dropdown
    id: impact
    attributes:
      label: How much does it stop you?
      options:
        - I cannot complete the task
        - I can complete it, with difficulty
        - It slows me down or gets in the way
  - type: checkboxes
    id: private
    attributes:
      label: Before you send it
      options:
        - label: This report contains no API key, secret, sign-in or payee link, or personal data I want kept private.
          required: true

name: Release

# Publishes the GitHub Release for a product tag that is already on GitHub (docs/RELEASING.md). Run by hand only:
#
#   gh workflow run release.yml -f tag=v0.1.0-beta.1 -f dry_run=true    # check, create nothing
#   gh workflow run release.yml -f tag=v0.1.0-beta.1                     # check, then create the release
#
# It never creates, moves or deletes a tag, never deploys (Vercel deploys main from branch pushes; a tag or a release
# starts nothing there) and never runs a migration. The first job reads and checks; only the second, which runs no
# code from the repository, can write, and it only creates a release that does not exist yet.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, already pushed: vX.Y.Z, or vX.Y.Z-alpha.N, -beta.N or -rc.N"
        required: true
        type: string
      dry_run:
        description: "Check everything and create nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exists: ${{ steps.existing.outputs.exists }}
      title: ${{ steps.notes.outputs.title }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      # A copy of this file on another branch could skip a check; the one on main is the one that was reviewed.
      - name: Run only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release workflow from main, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the tag's form
        id: version
        run: |
          if ! facts=$(node scripts/release-check.mjs tag "$TAG"); then
            echo "::error::Not a release tag. Use vX.Y.Z, or vX.Y.Z-alpha.N, vX.Y.Z-beta.N or vX.Y.Z-rc.N."
            exit 1
          fi
          echo "$facts" | tee -a "$GITHUB_OUTPUT"

      - name: Find the tag on GitHub
        id: tag
        run: |
          if ! ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG"); then
            echo "::error::$TAG is not on GitHub. Create it and push it first: git push origin refs/tags/$TAG"
            exit 1
          fi
          ref_type=$(jq -r '.object.type' <<<"$ref")
          if [ "$ref_type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Release from an annotated tag (git tag -a, or git tag -s to sign it)."
            exit 1
          fi
          tag_object=$(jq -r '.object.sha' <<<"$ref")
          annotation=$(gh api "repos/$GH_REPO/git/tags/$tag_object")
          target_type=$(jq -r '.object.type' <<<"$annotation")
          if [ "$target_type" != "commit" ]; then
            echo "::error::$TAG does not point at a commit."
            exit 1
          fi
          commit=$(jq -r '.object.sha' <<<"$annotation")
          signature=$(jq -r 'if .verification.verified then "verified by GitHub" else "not verified (" + .verification.reason + ")" end' <<<"$annotation")
          tagger=$(jq -r '.tagger.name + ", " + .tagger.date' <<<"$annotation")
          echo "$TAG points at $commit; tagged by $tagger; signature $signature."
          {
            echo "commit=$commit"
            echo "signature=$signature"
          } >> "$GITHUB_OUTPUT"

      - name: Check the commit is on main
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          status=$(gh api "repos/$GH_REPO/compare/main...$COMMIT" --jq '.status')
          case "$status" in
            identical|behind) echo "$COMMIT is on main." ;;
            *)
              echo "::error::$TAG points at $COMMIT, which is not on main (compared with main: $status). Release only commits on main."
              exit 1
              ;;
          esac

      - name: Check CI's verify passed on that commit
        id: ci
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          runs=$(gh api "repos/$GH_REPO/commits/$COMMIT/check-runs?check_name=verify&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at)')
          count=$(jq 'length' <<<"$runs")
          if [ "$count" -eq 0 ]; then
            echo "::error::CI's verify never ran on $COMMIT. Release a commit of main where it ran and passed."
            exit 1
          fi
          latest=$(jq '.[-1]' <<<"$runs")
          state="$(jq -r '.status' <<<"$latest")/$(jq -r '.conclusion // "none"' <<<"$latest")"
          url=$(jq -r '.html_url' <<<"$latest")
          if [ "$state" != "completed/success" ]; then
            echo "::error::CI's verify on $COMMIT is $state ($url). Release a commit whose verify passed, or re-run it."
            exit 1
          fi
          echo "verify passed on $COMMIT: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Idempotent: a release that exists is left exactly as it is, and the run still succeeds.
      - name: Look for an existing release
        id: existing
        run: |
          if url=$(gh release view "$TAG" --json url --jq '.url' 2>/dev/null); then
            echo "::notice::The release for $TAG already exists and was left unchanged: $url"
            {
              echo "exists=true"
              echo "url=$url"
            } >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the curated notes
        id: notes
        run: |
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::No $notes on main: the release will carry GitHub's generated notes only, titled Vestiarion $TAG."
            echo "title=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! title=$(node scripts/release-check.mjs notes "$TAG" "$notes" "$RUNNER_TEMP/body.md"); then
            echo "::error::$notes cannot be used as it is (see above)."
            exit 1
          fi
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "$title"
            echo "body<<$delimiter"
            cat "$RUNNER_TEMP/body.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "Notes from $notes; ${title}"

      - name: Summary
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
          SIGNATURE: ${{ steps.tag.outputs.signature }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          VERIFY_URL: ${{ steps.ci.outputs.url }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          EXISTING_URL: ${{ steps.existing.outputs.url }}
          TITLE: ${{ steps.notes.outputs.title }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EXISTS" = "true" ]; then
            outcome="Already released, left unchanged: $EXISTING_URL"
          elif [ "$DRY_RUN" = "true" ]; then
            outcome="Dry run: every check passed and nothing was created."
          else
            outcome="Checks passed: the next job creates the release."
          fi
          if [ "$PRERELEASE" = "true" ]; then kind="prerelease, never marked Latest"; else kind="stable, Latest chosen by GitHub from date and version"; fi
          {
            echo "## Release $TAG"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$COMMIT\` (on main) |"
            echo "| CI verify | [passed]($VERIFY_URL) |"
            echo "| Tag signature | $SIGNATURE |"
            echo "| Kind | $kind |"
            echo "| Title | ${TITLE:-Vestiarion $TAG} |"
            echo "| Notes | $([ -f "docs/releases/$TAG.md" ] && echo "docs/releases/$TAG.md, then" || echo "only") GitHub's generated notes |"
            echo
            echo "$outcome"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Create the release
    needs: check
    if: ${{ !inputs.dry_run && needs.check.outputs.exists == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ needs.check.outputs.commit }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      TITLE: ${{ needs.check.outputs.title }}
      BODY: ${{ needs.check.outputs.body }}
    steps:
      - name: Create the release
        run: |
          # The tag must still point where it was checked.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          now=$(gh api "repos/$GH_REPO/git/tags/$ref" --jq '.object.sha')
          if [ "$now" != "$COMMIT" ]; then
            echo "::error::$TAG moved from $COMMIT to $now since it was checked. Nothing was created; run the workflow again."
            exit 1
          fi
          if url=$(gh release view "$TAG" --json url --jq '.url' 2>/dev/null); then
            echo "::notice::The release for $TAG already exists and was left unchanged: $url"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "${TITLE:-Vestiarion $TAG}")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          if [ -n "$BODY" ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          url=$(gh release create "$TAG" "${args[@]}")
          echo "::notice::Released $TAG: $url"
          echo "Released [$TAG]($url) from \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"

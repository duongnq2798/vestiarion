name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Step logs need a GitHub login to read. The job summary does not, so
      # every step tees into one file and a failure publishes the tail of it —
      # a red run that cannot be diagnosed without credentials is a run that
      # gets ignored.
      - name: Environment
        run: |
          set -o pipefail
          { node --version; npm --version; uname -a; } 2>&1 | tee -a verify.log

      - name: Install
        run: set -o pipefail && npm ci 2>&1 | tee -a verify.log

      - name: Typecheck
        run: set -o pipefail && npm run typecheck 2>&1 | tee -a verify.log

      - name: Lint
        run: set -o pipefail && npm run lint 2>&1 | tee -a verify.log

      # No secrets are needed. Everything under test is pure: the ledger's
      # hash chain, risk tiering, the treasury policy, provider selection.
      # Anything that needs Supabase or Circle is exercised by `npm run cycle`
      # against a real project, not here.
      - name: Test
        run: set -o pipefail && npm run test 2>&1 | tee -a verify.log

      - name: Build
        run: set -o pipefail && npm run build 2>&1 | tee -a verify.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

      - name: Explain the failure
        if: failure()
        run: |
          # Annotations are the only part of a run readable without a GitHub
          # login; step logs and job summaries both require one. A red build
          # nobody outside the repo can diagnose is a red build that gets
          # ignored, so the cause goes here as well as in the summary.
          if [ -s verify.log ]; then
            tail -n 25 verify.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          else
            echo "::error title=CI failed early::No step produced output. The job failed before or during checkout, setup-node, or npm ci."
          fi
          {
            echo "## CI failed"
            echo
            echo '```'
            tail -n 80 verify.log 2>/dev/null || echo "(no log was produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Vestiarion agent cycle

# Runs one cycle for every live workspace (POST /api/agent/tick). Supabase Cron calls the route at 17 minutes past
# every sixth hour (supabase/cron/watches.sql), as GitHub ran this schedule 2 to 4 times a day at uneven hours; this
# workflow is its manual run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected agent cycle
        env:
          VESTIARION_URL: ${{ secrets.VESTIARION_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          test -n "$VESTIARION_URL"
          test -n "$AGENT_API_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $AGENT_API_TOKEN" \
            "${VESTIARION_URL%/}/api/agent/tick"

name: Vestiarion agent cycle

# Runs every live workspace's cycle. Supabase Cron calls the route at minute 17 of every sixth hour
# (supabase/cron/watches.sql), as GitHub started this schedule hours late or not at all; this workflow is its manual run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected agent cycle
        env:
          VESTIARION_URL: ${{ secrets.VESTIARION_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          test -n "$VESTIARION_URL"
          test -n "$AGENT_API_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $AGENT_API_TOKEN" \
            "${VESTIARION_URL%/}/api/agent/tick"

name: Vestiarion webhooks

# Sends webhook retries and anything still queued. Supabase Cron calls the route every 10 minutes
# (supabase/cron/watches.sql), as GitHub started this schedule only a few times a day; this workflow is its manual run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webhooks
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected webhook dispatch
        env:
          VESTIARION_URL: ${{ secrets.VESTIARION_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
        run: |
          test -n "$VESTIARION_URL"
          test -n "$AGENT_API_TOKEN"
          curl --fail-with-body --silent --show-error \
            --max-time 330 \
            --request POST \
            --header "Authorization: Bearer $AGENT_API_TOKEN" \
            "${VESTIARION_URL%/}/api/platform/webhooks"

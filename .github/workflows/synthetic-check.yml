name: Vestiarion production check

# Opens production's public pages every 10 minutes from GitHub's servers, outside Vercel and Supabase, and tells the
# team on a private Discord channel when a check fails two rounds running, and once when it passes again
# (docs/superpowers/specs/2026-10-28-production-check-design.md). Of production it reads public pages only: no
# production token, no database. After each round it publishes the last 7 days of rounds to the repository's status
# branch, which the status page reads (docs/superpowers/specs/2026-11-04-status-page-design.md). GitHub started 5- and
# 10-minute schedules only a few times a day (tests/supabase-cron.test.ts), so an hourly schedule starts a run that
# checks every 10 minutes for 5 h 45 min. A start that comes while one runs waits as the group's one pending run and
# begins when it ends, so the rounds go on as long as GitHub starts one in 6 hours. The one secret,
# MONITOR_DISCORD_WEBHOOK_URL, is never printed; without it the checks still run, and the log says no alert could be
# sent. The run fails only when the check itself could not do its job, never because a page did.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-check
  cancel-in-progress: false

jobs:
  check:
    # A fork checks nothing, unless its repository variable SYNTHETIC_ORIGIN names its own deployment.
    if: github.repository == 'duongnq2798/vestiarion' || vars.SYNTHETIC_ORIGIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Write, for the status branch: the script moves refs/heads/status and no other ref. main's protection (CI's verify
    # on a pull request, admins included) keeps the token from pushing to main, but not from merging a pull request
    # whose verify passed, so only the script's own step is given the token: no action in this job runs with it, and
    # the cache actions are pinned to a commit (status page SP5).
    permissions:
      contents: write
    steps:
      # The script alone, at this run's commit, from the public repository: no action and no token, and nothing
      # installed, since the script uses Node's built-ins only and runs with the runner's own Node.
      - name: Fetch the script
        run: >-
          curl --fail --silent --show-error --location --retry 3 --max-time 60 --create-dirs
          --output scripts/synthetic-check.mjs
          "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/synthetic-check.mjs"

      # Each check's failures in a row and whether the team was told, from the newest run that saved them.
      - name: Restore the last run's state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .synthetic-state.json
          key: synthetic-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: synthetic-state-

      - name: Check production every 10 minutes
        env:
          SYNTHETIC_ORIGIN: ${{ vars.SYNTHETIC_ORIGIN || 'https://www.vestiarion.xyz' }}
          MONITOR_DISCORD_WEBHOOK_URL: ${{ secrets.MONITOR_DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/synthetic-check.mjs --loop --minutes 345 --every 10 --state .synthetic-state.json --publish-status

      # The script writes the file after every round, so a run that failed or was cancelled still saves its last one.
      - name: Save the state for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .synthetic-state.json
          key: synthetic-state-${{ github.run_id }}-${{ github.run_attempt }}
